<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Price Ladder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2a36'/%3E%3Cpolyline points='5,23 12,16 17,20 27,9' fill='none' stroke='%234fd1a5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='21,9 27,9 27,15' fill='none' stroke='%234fd1a5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #1a222b; --panel: #222c37; --line: #2f3b48; --text: #d7dee6; --muted: #8c99a6;
    --accent: #4fd1a5; --up: #5fd38d; --down: #f2867c; --hl: #2c3a2f;
  }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px;
         background: var(--bg); color: var(--text); line-height: 1.4; }
  h1 { font-size: 1.4rem; color: var(--accent); font-weight: 600; }
  form { background: var(--panel); padding: 6px 14px 14px; border-radius: 10px; margin-bottom: 16px; }
  fieldset { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; border: 0; border-top: 1px solid var(--line);
             margin: 0; padding: 10px 0 12px; }
  fieldset:first-child { border-top: 0; }
  legend { color: var(--accent); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 0 6px 0 0; }
  details { border-top: 1px solid var(--line); padding-top: 10px; }
  details fieldset { border-top: 0; }
  summary { cursor: pointer; color: var(--muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  summary:hover { color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
  label { display: flex; flex-direction: column; font-size: .8rem; gap: 4px; color: var(--muted); }
  input, select, button { font-size: 1rem; padding: 6px 8px; border-radius: 6px;
         border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input { width: 110px; }
  button { cursor: pointer; background: var(--line); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums;
          background: var(--panel); border-radius: 10px; overflow: hidden; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .85rem; }
  tbody tr:hover { background: #26323e; }
  tr.current { background: var(--hl); font-weight: bold; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .summary { margin: 8px 0 16px; }
  .muted { font-size: .85rem; color: var(--muted); }
  .state { font-size: .75rem; }
  .state.armed { color: var(--accent); }
  .state.fired { color: var(--down); }
  input.armed { border-color: var(--accent); }
  input.fired { border-color: var(--down); }
  #alertModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
                align-items: center; justify-content: center; z-index: 10; }
  #alertModal .box { background: var(--panel); border: 2px solid var(--down); border-radius: 12px;
                     padding: 24px 28px; text-align: center; max-width: 90vw; }
  #alertModal h2 { margin: 0 0 8px; color: var(--down); }
  #alertModalPrice { font-size: 2.4rem; font-weight: bold; margin: 8px 0; }
  #alertModal button { margin-top: 12px; font-size: 1.1rem; padding: 8px 24px; }
</style>
</head>
<body>
<h1>Stock Price Ladder</h1>

<form id="f" onsubmit="return false">
  <fieldset>
    <legend>Position</legend>
    <label id="symBox">Symbol <input id="sym" type="text" style="text-transform:uppercase"></label>
    <button type="button" id="getPrice">Get price</button>
    <label>Quantity <input id="qty" type="number" min="0" step="any"></label>
    <label>Bought at <input id="cost" type="number" min="0" step="any" placeholder="optional"></label>
    <label>Current price <input id="price" type="number" min="0" step="any"></label>
  </fieldset>

  <details id="ladderBox">
    <summary>Ladder</summary>
    <fieldset>
    <label>Step
      <select id="step">
        <option>0.5</option><option selected>1</option><option>2</option>
        <option>5</option><option>10</option><option>20</option><option>50</option>
      </select>
    </label>
    <label>Custom step <input id="custom" type="number" min="0" step="any" placeholder="optional"></label>
    <label>Step type
      <select id="mode">
        <option value="amt">Price amount</option>
        <option value="pct">Percent %</option>
      </select>
    </label>
    <label>Rows each way <input id="rows" type="number" min="1" max="100" value="10"></label>
    </fieldset>
  </details>

  <details id="alertsBox">
    <summary>Alerts</summary>
    <fieldset>
      <label>Alert above <span id="alertUpState" class="state"></span><input id="alertUp" type="number" min="0" step="1" placeholder="price"></label>
      <label>Alert below <span id="alertDownState" class="state"></span><input id="alertDown" type="number" min="0" step="1" placeholder="price"></label>
      <label>Sound
        <select id="alertSound">
          <option value="tap" selected>Soft tap</option>
          <option value="siren">Police siren</option>
        </select>
      </label>
      <label>Play
        <select id="alertRepeat">
          <option value="once">Once</option>
          <option value="loop">Until dismissed (max 7 min)</option>
        </select>
      </label>
      <button type="button" id="testSound">Test sound</button>
    </fieldset>
  </details>

  <details id="settings">
    <summary>Settings</summary>
    <fieldset>
      <label id="refreshBox">Auto refresh
        <select id="refreshMin">
          <option value="0">Off</option><option value="1">1 min</option><option value="2">2 min</option>
          <option value="5" selected>5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="30">30 min</option>
        </select>
      </label>
      <label>Show £ <input id="gbp" type="checkbox" style="width:auto"></label>
      <label>USD→GBP rate <input id="rate" type="number" min="0" step="any"></label>
      <button type="button" id="refresh">Get live rate</button>
      <label>Summary size
        <select id="sumSize">
          <option value="1">Normal</option><option value="1.25">Large</option>
          <option value="1.6">Larger</option><option value="2">Huge</option>
        </select>
      </label>
    </fieldset>
  </details>

  <details id="histBox">
    <summary>History</summary>
    <fieldset>
      <label>Saved inputs <select id="history" style="max-width:300px"></select></label>
      <button type="button" id="restore">Restore</button>
    </fieldset>
  </details>

  <div class="actions">
    <button type="button" id="clear">Clear</button>
  </div>
</form>

<div class="summary" id="alertInfo" style="color:var(--down);font-weight:bold"></div>
<div id="alertModal">
  <div class="box">
    <h2>🚨 Price alert</h2>
    <div id="alertModalText"></div>
    <div id="alertModalPrice"></div>
    <div id="alertModalNote" class="muted"></div>
    <button type="button" id="alertDismiss">Dismiss</button>
  </div>
</div>
<div class="summary muted" id="priceInfo"></div>
<div class="summary muted" id="rateInfo"></div>
<div class="summary" id="summary"></div>
<table>
  <thead id="thead"></thead>
  <tbody id="tbody"></tbody>
</table>

<script src="config.js"></script>
<script>
  const POLYGON_KEY = (window.POLYGON_KEY || "").trim();
  const KEY = 'stockLadder';
  const ids = ['sym', 'qty','cost', 'price', 'step', 'custom','mode', 'rows', 'rate', 'rateInfoText', 'alertUp', 'alertDown', 'sumSize', 'refreshMin', 'alertSound', 'alertRepeat'];
  const ttlMin = () => parseFloat(el('refreshMin').value) || 5; // cache lifetime follows refresh (5 if Off)

  // Police-style siren via Web Audio: tone sweeps 650↔1300 Hz for 3 seconds. No sound file needed.
  let audio;
  function unlockAudio() { audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume(); }
  function siren(seconds = 3) {
    unlockAudio();
    const osc = audio.createOscillator(), gain = audio.createGain(), now = audio.currentTime;
    osc.type = 'sawtooth';
    for (let s = 0; s < seconds; s += 0.5) {
      osc.frequency.setValueAtTime(650, now + s);
      osc.frequency.linearRampToValueAtTime(1300, now + s + 0.25);
      osc.frequency.linearRampToValueAtTime(650, now + s + 0.5);
    }
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.setValueAtTime(0.15, now + seconds - 0.05);
    gain.gain.linearRampToValueAtTime(0, now + seconds);
    osc.connect(gain).connect(audio.destination);
    osc.start(now);
    osc.stop(now + seconds);
  }

  // Soft tap: short gentle blip.
  function tap() {
    unlockAudio();
    const osc = audio.createOscillator(), gain = audio.createGain(), now = audio.currentTime;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
    osc.connect(gain).connect(audio.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }
  const playAlertSound = () => el('alertSound').value === 'tap' ? tap() : siren();

  // Alarm: pop-up with the price; sound plays once, or every 3 s until dismissed (max 7 min).
  const MAX_ALARM_MS = 7 * 60 * 1000;
  let alarmLoop, alarmCutoff;
  function stopAlarmSound() { clearInterval(alarmLoop); clearTimeout(alarmCutoff); }
  function dismissAlarm() { stopAlarmSound(); el('alertModal').style.display = 'none'; }
  function startAlarm(msg, p) {
    stopAlarmSound();
    el('alertModalText').textContent = msg;
    el('alertModalPrice').textContent = '$' + money(p);
    el('alertModalNote').textContent = new Date().toLocaleTimeString();
    el('alertModal').style.display = 'flex';
    playAlertSound();
    if (el('alertRepeat').value === 'loop') {
      alarmLoop = setInterval(playAlertSound, 3000); // siren lasts 3 s, so it plays back-to-back
      alarmCutoff = setTimeout(() => {
        stopAlarmSound();
        el('alertModalNote').textContent += ' · sound stopped after 7 min';
      }, MAX_ALARM_MS);
    }
  }

  // Alerts: boxes default to the current price (whole number) but are OFF until the user changes them.
  // Changing a box arms it. When it fires, the value stays but the alert turns off until changed again.
  // State per box: '' = off (not set), 'armed', 'fired'.
  const AKEY = 'alertState';
  const alertState = () => JSON.parse(localStorage.getItem(AKEY) || '{}');
  function setAlertState(id, s) {
    const st = alertState(); st[id] = s; localStorage.setItem(AKEY, JSON.stringify(st));
    showAlertState();
  }
  function showAlertState() {
    const st = alertState();
    ['alertUp', 'alertDown'].forEach(id => {
      const s = st[id] || '';
      el(id).className = s;
      el(id + 'State').className = 'state ' + s;
      el(id + 'State').textContent = s === 'armed' ? '· on' : s === 'fired' ? '· triggered, change to re-set' : '· off';
    });
  }
  function prefillAlerts(price) {
    if (!(price > 0)) return;
    const st = alertState();
    ['alertUp', 'alertDown'].forEach(id => {
      if (!st[id] && !el(id).value) el(id).value = Math.round(price); // default, stays off
    });
  }

  function checkAlerts(sym, p) {
    const st = alertState();
    const up = parseFloat(el('alertUp').value), down = parseFloat(el('alertDown').value);
    const hits = [];
    if (st.alertUp === 'armed' && up > 0 && p >= up) { hits.push(`above ${money(up)}`); setAlertState('alertUp', 'fired'); }
    if (st.alertDown === 'armed' && down > 0 && p <= down) { hits.push(`below ${money(down)}`); setAlertState('alertDown', 'fired'); }
    if (!hits.length) return;
    const msg = `${sym} is ${hits.join(' and ')}`;
    el('alertInfo').textContent = `🚨 ${msg}: now $${money(p)} (${new Date().toLocaleTimeString()})`;
    startAlarm(msg, p);
  }
  const el = id => document.getElementById(id);
  const money = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const gbpFmt = n => '£' + money(n);

  function load(saved = JSON.parse(localStorage.getItem(KEY) || '{}')) {
    ids.forEach(id => {
      if (saved[id] === undefined) return;
      if (id === 'rateInfoText') el('rateInfo').textContent = saved[id];
      else el(id).value = saved[id];
    });
    el('gbp').checked = !!saved.gbp;
  }

  function save() {
    const data = {};
    ids.forEach(id => data[id] = id === 'rateInfoText' ? el('rateInfo').textContent : el(id).value);
    data.gbp = el('gbp').checked;
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  // History: Clear saves the current inputs here (newest first, max 5) so they can be restored.
  const HKEY = 'stockLadderHistory';
  const getHistory = () => JSON.parse(localStorage.getItem(HKEY) || '[]');

  function pushHistory() {
    save();
    const data = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (!data.qty && !data.price && !data.sym) return; // nothing worth keeping
    const h = getHistory();
    h.unshift({ t: Date.now(), data });
    localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 5)));
  }

  function renderHistory() {
    const h = getHistory();
    el('histBox').style.display = el('restore').style.display = h.length ? '' : 'none';
    el('history').innerHTML = h.map((e, i) => {
      const d = e.data, when = new Date(e.t).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `<option value="${i}">${when} · ${d.sym || '—'} · ${d.qty || 0} @ ${d.price || '?'}</option>`;
    }).join('');
  }

  function restoreHistory() {
    const e = getHistory()[el('history').value];
    if (!e) return;
    load(e.data);
    localStorage.removeItem(AKEY); showAlertState(); // restored alerts start off
    startTimer();
    render();
    fetchPrice();
  }

  // One Polygon call: single-ticker snapshot. Latest price = prev close + today's change
  // (reflects last trade incl. extended hours); falls back to last minute bar / day close.
  async function fetchPrice(force = false) {
    const sym = el('sym').value.trim().toUpperCase();
    if (!sym || !POLYGON_KEY) return;
    const cache = JSON.parse(localStorage.getItem('priceCache') || '{}');
    const ageMin = (Date.now() - cache.t) / 60000;
    if (!force && cache.sym === sym && ageMin < ttlMin()) {
      el('price').value = cache.price;
      el('priceInfo').textContent = cache.info + ` · cached, refreshes in ${Math.ceil(ttlMin() - ageMin)} min`;
      render();
      return;
    }
    el('priceInfo').textContent = `Fetching ${sym}…`;
    try {
      const r = await fetch(`https://api.polygon.io/v2/snapshot/locale/us/markets/stocks/tickers/${encodeURIComponent(sym)}?apiKey=${POLYGON_KEY}`);
      const j = await r.json();
      const t = j.ticker;
      if (!t) throw new Error(j.error || j.message || j.status || 'No data');
      const prev = t.prevDay && t.prevDay.c;
      let p = prev && t.todaysChange != null ? prev + t.todaysChange : 0;
      if (!(p > 0)) p = (t.min && t.min.c) || (t.day && t.day.c) || prev;
      el('price').value = +p.toFixed(4);
      el('priceInfo').textContent = `${sym} latest $${money(p)} · regular close $${money((t.day && t.day.c) || 0)}` +
        ` · prev close $${money(prev || 0)} · fetched ${new Date().toLocaleTimeString()}`;
      localStorage.setItem('priceCache', JSON.stringify({ sym, price: el('price').value, info: el('priceInfo').textContent, t: Date.now() }));
      checkAlerts(sym, p);
    } catch (e) {
      el('priceInfo').textContent = `Could not get price for ${sym}: ${e.message}`;
    }
    render();
  }

  async function fetchRate() {
    el('rateInfo').textContent = 'Fetching live rate…';
    try {
      const r = await fetch('https://api.frankfurter.dev/v1/latest?from=USD&to=GBP');
      const j = await r.json();
      el('rate').value = j.rates.GBP;
      el('rateInfo').textContent = `Rate 1 USD = ${j.rates.GBP} GBP (ECB, ${j.date})`;
    } catch {
      try {
        const r = await fetch('https://open.er-api.com/v6/latest/USD');
        const j = await r.json();
        el('rate').value = j.rates.GBP;
        el('rateInfo').textContent = `Rate 1 USD = ${j.rates.GBP} GBP (${new Date(j.time_last_update_unix * 1000).toLocaleDateString()})`;
      } catch {
        el('rateInfo').textContent = 'Could not fetch live rate — enter it manually.';
      }
    }
    render();
  }

  function render() {
    save();
    const qty = parseFloat(el('qty').value);
    const price = parseFloat(el('price').value);
    prefillAlerts(price);
    const custom = parseFloat(el('custom').value);
    const step = custom > 0 ? custom : parseFloat(el('step').value);
    const pct = el('mode').value === 'pct';
    const rows = Math.min(Math.max(parseInt(el('rows').value) || 10, 1), 100);
    const tbody = el('tbody');
    tbody.innerHTML = '';

    if (!(qty > 0) || !(price > 0)) {
      el('summary').textContent = 'Enter quantity and price.';
      el('thead').innerHTML = '';
      return;
    }
    const cost = parseFloat(el('cost').value);
    const hasCost = cost > 0;
    const costTotal = hasCost ? qty * cost : 0;
    const base = qty * price;
    const sign = n => n > 0 ? '+' : '';
    const color = n => n > 0 ? 'up' : n < 0 ? 'down' : '';

    const rate = parseFloat(el('rate').value);
    const showGbp = el('gbp').checked && rate > 0;
    const gb = n => showGbp ? ` <span class="muted">(${n < 0 ? '−' : ''}${gbpFmt(Math.abs(n) * rate)})</span>` : '';

    let summary = `Current value: <b>$${money(base)}</b>${gb(base)} (${qty} × <span class="${hasCost ? color(price - cost) : ''}">$${money(price)}</span>)`;
    if (hasCost) {
      const pl = base - costTotal;
      summary += ` &nbsp;|&nbsp; Cost: <b>$${money(costTotal)}</b>${gb(costTotal)} (${qty} × $${money(cost)})` +
                 ` &nbsp;|&nbsp; P/L now: <b class="${color(pl)}">${sign(pl)}$${money(pl)}` +
                 ` (${sign(pl)}${(pl / costTotal * 100).toFixed(2)}%)</b>${gb(pl)}`;
    }
    if (el('gbp').checked && !(rate > 0)) summary += '<br>Enter or fetch a USD→GBP rate to show £.';
    el('summary').innerHTML = summary;
    el('summary').style.fontSize = (el('sumSize').value || 1) + 'em';
    el('thead').innerHTML = '<tr><th>Move</th><th>Price</th><th>Value ($)</th>' +
                            (showGbp ? '<th>Value (£)</th>' : '') + '<th>Change vs Now</th>' +
                            (hasCost ? '<th>P/L vs Bought</th>' : '') +
                            (hasCost && showGbp ? '<th>P/L (£)</th>' : '') + '</tr>';

    for (let i = rows; i >= -rows; i--) {
      const p = pct ? price * (1 + i * step / 100) : price + i * step;
      if (p < 0) continue;
      const value = qty * p;
      const diff = value - base;
      const cls = i > 0 ? 'up' : i < 0 ? 'down' : '';
      const move = i === 0 ? 'Now' : (i > 0 ? '+' : '−') + +(Math.abs(i) * step).toFixed(4) + (pct ? '%' : '');
      const tr = document.createElement('tr');
      if (i === 0) tr.className = 'current';
      let html = `<td class="${cls}">${move}</td><td>${money(p)}</td><td>${money(value)}</td>` +
                 (showGbp ? `<td>${gbpFmt(value * rate)}</td>` : '') +
                 `<td class="${cls}">${sign(diff)}${money(diff)}</td>`;
      if (hasCost) {
        const pl = value - costTotal;
        html += `<td class="${color(pl)}">${sign(pl)}${money(pl)} (${sign(pl)}${(pl / costTotal * 100).toFixed(1)}%)</td>`;
        if (showGbp) html += `<td class="${color(pl)}">${pl < 0 ? '−' : sign(pl)}${gbpFmt(Math.abs(pl) * rate)}</td>`;
      }
      tr.innerHTML = html;
      tbody.appendChild(tr);
    }
  }

  el('clear').onclick = () => {
    pushHistory(); renderHistory();
    localStorage.removeItem(KEY);
    localStorage.removeItem('priceCache');
    el('sym').value = ''; el('priceInfo').textContent = '';
    el('alertUp').value = ''; el('alertDown').value = ''; el('alertInfo').textContent = '';
    localStorage.removeItem(AKEY); showAlertState();
    el('alertSound').value = 'tap'; el('alertRepeat').value = 'once'; dismissAlarm();
    el('qty').value = ''; el('cost').value = ''; el('price').value = '';
    el('step').value = '1'; el('custom').value = ''; el('sumSize').value = '1'; el('refreshMin').value = '5'; startTimer();el('mode').value = 'amt'; el('rows').value = '10';
    el('gbp').checked = false; el('rate').value = ''; el('rateInfo').textContent = '';
    render();
  };

  ids.filter(id => id !== 'rateInfoText').forEach(id => el(id).addEventListener('input', render));
  el('gbp').addEventListener('change', () => {
    if (el('gbp').checked && !el('rate').value) fetchRate(); else render();
  });
  el('refresh').onclick = fetchRate;
  el('testSound').onclick = () => playAlertSound();
  el('alertDismiss').onclick = dismissAlarm;
  // Browsers only allow sound after the user interacts with the page once.
  ['click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { once: true }));
  el('getPrice').onclick = () => fetchPrice(true); // manual click always fetches fresh
  el('sym').addEventListener('keydown', e => { if (e.key === 'Enter') fetchPrice(true); });
  el('restore').onclick = restoreHistory;
  // User changing an alert box (typing or arrows) turns it on; emptying it turns it off.
  ['alertUp', 'alertDown'].forEach(id => el(id).addEventListener('input', () => {
    setAlertState(id, parseFloat(el(id).value) > 0 ? 'armed' : '');
    el('alertInfo').textContent = '';
  }));
  load();
  renderHistory();
  showAlertState();
  // Collapsible sections start collapsed; remember if opened.
  ["ladderBox", "alertsBox", "settings", "histBox"].forEach(id => {
    el(id).open = localStorage.getItem(id + "Open") === "1";
    el(id).addEventListener("toggle", () => localStorage.setItem(id + "Open", el(id).open ? "1" : "0"));
  });
  render();
  if (!POLYGON_KEY) { el("symBox").style.display = "none"; el("refreshBox").style.display = "none"; el("getPrice").style.display = "none"; }
  fetchPrice(); // one call per page load (only if a symbol is saved)
  // Auto-refresh timer; restarts when the interval option changes.
  let timer;
  function startTimer() {
    clearInterval(timer);
    const m = parseFloat(el("refreshMin").value);
    if (m > 0) timer = setInterval(fetchPrice, m * 60 * 1000 + 2000);
  }
  el("refreshMin").addEventListener("change", startTimer);
  startTimer();
